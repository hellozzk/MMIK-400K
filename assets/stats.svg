<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="210" viewBox="0 0 1280 210" role="img" aria-labelledby="title">
  <title id="title">MMIK-400K paper statistics: 461,388 images, 432 categories, 1,271,155 ClosedQA pairs and 133,140 OpenQA pairs</title>
  <defs>
