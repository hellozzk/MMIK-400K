    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17304c"/><stop offset="1" stop-color="#28476d"/></linearGradient>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#333950"/><stop offset="1" stop-color="#52516f"/></linearGradient>
  </defs>
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="8" y="12" width="300" height="184" rx="20" fill="url(#a)"/>
