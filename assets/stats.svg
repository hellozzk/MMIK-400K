    <text x="34" y="105" fill="#ffffff" font-size="39" font-weight="700" letter-spacing="-1">461,388</text>
    <text x="355" y="105" fill="#ffffff" font-size="39" font-weight="700" letter-spacing="-1">432</text>
    <text x="676" y="105" fill="#ffffff" font-size="39" font-weight="700" letter-spacing="-1">1,271,155</text>
