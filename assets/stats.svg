    <rect x="971" y="12" width="300" height="184" rx="20" fill="url(#d)"/>
    <path d="M34 42h42" stroke="#63d8ea" stroke-width="4" stroke-linecap="round"/>
    <path d="M355 42h42" stroke="#7fe0cb" stroke-width="4" stroke-linecap="round"/>
    <path d="M676 42h42" stroke="#9ab7ff" stroke-width="4" stroke-linecap="round"/>
